<!doctype html>
<!-- Marquee promo tile, 1400x560. -->
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="style.css">
  <style>
    body { width: 1400px; height: 560px; color: #fff; background: radial-gradient(circle at 80% 10%, #60a5fa 0, transparent 45%), linear-gradient(150deg, #2563eb, #1e3a8a); }
    .m { height: 100%; display: grid; grid-template-columns: 1fr 520px; align-items: center; padding: 0 96px; gap: 40px; }
    .top { display: flex; align-items: center; gap: 22px; }
    .top img { width: 128px; height: 128px; margin: -16px; filter: drop-shadow(0 10px 20px rgb(15 23 42 / 0.35)); }
    .name { font-size: 64px; font-weight: 800; letter-spacing: -2px; }
    h1 { font-size: 46px; margin: 34px 0 14px; letter-spacing: -1px; }
    p { margin: 0; font-size: 22px; color: #dbeafe; line-height: 1.5; }
    .viz { position: relative; height: 380px; }
    .viz span { position: absolute; padding: 10px 18px; border-radius: 14px; background: rgb(255 255 255 / 0.14); font-size: 22px; font-weight: 700; white-space: nowrap; }
    .viz .lock { left: 50%; top: 50%; transform: translate(-50%, -50%); width: 220px; height: 220px; padding: 0; border-radius: 48px; background: #fff;
      display: grid; place-items: center; box-shadow: 0 24px 50px rgb(15 23 42 / 0.35); }
    .viz .lock b { color: var(--blue-dark); font-size: 44px; letter-spacing: -1px; }
    .viz .lock small { display: block; color: var(--muted); font-size: 18px; font-weight: 600; text-align: center; margin-top: 2px; }
  </style>
</head>
<body>
  <div class="m">
    <div>
      <div class="top"><img src="../../extension/icons/128.png" alt=""><span class="name">Lang Lock</span></div>
      <h1>One language for every site.</h1>
      <p>Accept-Language, navigator.language and the site's own translation.<br>No data. No account. No server.</p>
    </div>
    <div class="viz">
      <span style="left: 10px; top: 20px">Polski</span>
      <span style="right: 0; top: 0">Ελληνικά</span>
      <span style="left: 0; bottom: 70px">Deutsch</span>
      <span style="right: 10px; bottom: 30px">日本語</span>
      <span style="left: 180px; bottom: 0">Español</span>
      <span style="left: 200px; top: 0">Français</span>
      <span class="lock"><div><b>English</b><small>everywhere</small></div></span>
    </div>
  </div>
</body>
</html>
