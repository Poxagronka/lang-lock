# After a merge to main: lint, test, then upload and submit the extension when manifest.json has a new version.
name: publish
on:
  push:
    branches: [main]
    paths: ['extension/**', 'scripts/publish.mjs', '.github/workflows/publish.yml']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write # Workload Identity Federation: GitHub OIDC -> a 1-hour Google token, no stored key.
concurrency: publish
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/965771276460/locations/global/workloadIdentityPools/github/providers/lang-lock
          service_account: lang-lock-publisher@mcp-sheets-sasha-2026.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
      - run: npm run zip
      - run: node scripts/publish.mjs
        env:
          CWS_TOKEN: ${{ steps.auth.outputs.access_token }}
